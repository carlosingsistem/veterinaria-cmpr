{% extends 'base.html' %}

{% block title %}Clínica Veterinaria{% endblock %}

{% block content %}
<div class="row">
    {% for cita in citas %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ cita.mascota }} ({{ cita.escpecie}})</h5>
                <p class="card-text"><strong>Dueño:</strong> {{ cita.propietario }}<br>
                <strong>Fecha:</strong> {{ cita.fecha }}</p>
                <a href="#" class="btn btn-sm btn-warning">Editar</a>
                <a href="#" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar cita?')">Cancelar</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
