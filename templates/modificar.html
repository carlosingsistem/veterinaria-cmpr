{% extends 'base.html' %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-warning text-dark">
        <h2 class="h5 mb-0">Modificar Cita: {{ cita.mascota }}</h2>
    </div>
    <div class="card-body">
        <!-- en cada campo imprimimos el valor del campo correspondiente que tiene dicha cita => cita.nombre, cita.mascota, etc -->
        <form action="{{ url_for('modificar', id=cita.id) }}" method="post">
            
            <div class="mb-3">
                <label for="mascota" class="form-label">Nombre de la Mascota</label>
                <input type="text" class="form-control" id="mascota" name="mascota" 
                       value="{{ cita.mascota }}" required>
            </div>

            <div class="mb-3">
                <label for="propietario" class="form-label">Propietario</label>
                <input type="text" class="form-control" id="propietario" name="propietario" 
                       value="{{ cita.propietario }}" required>
            </div>

            <div class="mb-3">
                <label for="especie" class="form-label">Especie</label>
                <select class="form-select" id="especie" name="especie" required>
                    <option value="Perro" {% if cita.especie == 'Perro' %}selected{% endif %}>Perro</option>
                    <option value="Gato" {% if cita.especie == 'Gato' %}selected{% endif %}>Gato</option>
                    <option value="Ave" {% if cita.especie == 'Ave' %}selected{% endif %}>Ave</option>
                    <option value="Otro" {% if cita.especie == 'Otro' %}selected{% endif %}>Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="fecha" class="form-label">Nueva Fecha </label>
                <input type="date" class="form-control" id="fecha" name="fecha" 
                       value="{{ cita.fecha }}" required>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Actualizar Datos</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
